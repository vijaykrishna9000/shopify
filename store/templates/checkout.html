{% extends 'base.html' %}
{% block content %}
<div class="container text-center mt-5">
    <h2>Complete Payment</h2>
    <p>Pay Rs. {{ product.price }} securely with Razorpay.</p>
    <button id="pay-button" class="btn btn-success">Pay Now</button>
</div>

<form id="payment-form" method="post" action="{{ callback_url }}" class="d-none">
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
</form>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    const options = {
        key: "{{ razorpay_key_id }}",
        amount: "{{ amount }}",
        currency: "INR",
        name: "E-Commerce",
        description: "{{ product.name|escapejs }}",
        order_id: "{{ razorpay_order_id }}",
        prefill: {
            name: "{{ customer_name|escapejs }}",
            email: "{{ customer_email|escapejs }}"
        },
        handler: function (response) {
            document.getElementById("razorpay_order_id").value = response.razorpay_order_id;
            document.getElementById("razorpay_payment_id").value = response.razorpay_payment_id;
            document.getElementById("razorpay_signature").value = response.razorpay_signature;
            document.getElementById("payment-form").submit();
        },
        modal: {
            ondismiss: function () {
                window.location.href = "{% url 'store:payment_cancel' %}";
            }
        },
        theme: {
            color: "#198754"
        }
    };

    const razorpay = new Razorpay(options);
    document.getElementById("pay-button").onclick = function (event) {
        razorpay.open();
        event.preventDefault();
    };
</script>
{% endblock %}
