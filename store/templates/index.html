<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{% url 'store:home' %}">shopify</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link {% if not active_category %}active{% endif %}" href="{% url 'store:home' %}">All</a>
                {% for category in product_categories %}
                <a href="{% url 'store:category_products' category.id %}">
                {{ category.name }}
                </a>
                {% endfor %}
            </div>
            {% if user.is_authenticated %}
            <a class="btn btn-outline-danger" href="{% url 'accounts:logout' %}">Logout</a>
            {% else %}
            <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Login</a>
            {% endif %}
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
